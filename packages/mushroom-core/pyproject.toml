[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mushroom-core"
version = "0.1.0"
description = "Shared domain models, config, Postgres KV and pgmq queue client for Mushroom."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["mushroom_core"]

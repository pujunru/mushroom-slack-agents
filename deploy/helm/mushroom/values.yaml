# Default values for the mushroom chart.
#
# The defaults bring up a self-contained, working stack: a bundled Postgres, a
# gateway, one agent worker, and a Traefik IngressRoute. Secrets default to a
# plain Kubernetes Secret so the chart installs with no external dependency;
# switch `secrets.provider` to `externalSecrets` for Vault.

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Images
# ---------------------------------------------------------------------------
image:
  registry: ghcr.io
  repository: your-org/mushroom
  # Tags are per-component so the gateway and agents can be rolled separately.
  pullPolicy: IfNotPresent
  tags:
    gateway: "0.1.0"
    agent: "0.1.0"
    migrate: "0.1.0"
imagePullSecrets: []

# ---------------------------------------------------------------------------
# Slack gateway — stateless, horizontally scalable
# ---------------------------------------------------------------------------
gateway:
  replicaCount: 2
  # Slack's 3-second ack budget is the reason for a PDB and a fast readiness
  # probe: losing all replicas means Slack retries, and eventually disables
  # the subscription.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Spread replicas across nodes so one node failure cannot take the
  # endpoint down.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: gateway
  env: {}

# ---------------------------------------------------------------------------
# Agent workers — long-lived pgmq consumers
# ---------------------------------------------------------------------------
agent:
  replicaCount: 2
  # Each worker runs one job at a time, so concurrency is replicas. A job may
  # run for minutes, so the grace period must let an in-flight job finish.
  terminationGracePeriodSeconds: 660
  jobTimeoutSeconds: 600
  # Must exceed jobTimeoutSeconds, or a slow job is redelivered while still
  # running. The worker also heartbeats its lease.
  visibilityTimeoutSeconds: 900
  maxDeliveryAttempts: 5
  # opencode model string, in `provider/model` form. The provider prefix
  # selects the backend — switching providers is a values change, not a code
  # change. Examples:
  #   openrouter/anthropic/claude-sonnet-4.5   (one key, many vendors)
  #   anthropic/claude-sonnet-4.5              (direct)
  #   openai/gpt-5                             (direct)
  model: "openrouter/deepseek/deepseek-v4-flash-0731"
  # The environment variable opencode reads the credential from. It is
  # provider-specific, so it must match `model` above.
  modelApiKeyEnv: "OPENROUTER_API_KEY"
  replyToSlack: true
  # The agent's system prompt, written to AGENTS.md in its working directory,
  # which is where opencode reads instructions from.
  #
  # This is the knob you will reach for most: it is what makes the bot yours
  # rather than a generic assistant. Changing it is a `helm upgrade`, not an
  # image rebuild, and the pods restart automatically because the deployment
  # carries a checksum of this value.
  #
  # Set it to "" to ship no AGENTS.md and let opencode use its own defaults.
  #
  # Two things worth saying in any prompt here, both reflected below: replies
  # land in Slack, so brevity and Slack's own markdown matter; and the agent
  # runs unattended with auto-accepted permissions, so it should say what it
  # cannot do rather than guess.
  systemPrompt: |
    # Mushroom

    You are a helpful agent answering questions in Slack.

    ## Replies

    - Answer in **two or three sentences** unless asked for more. Slack is a
      chat window, not a document.
    - Use Slack markdown: `*bold*`, `_italic_`, `` `code` ``, and fenced
      blocks for anything multi-line.
    - When someone asks for a specific format ("just the number"), give
      exactly that and nothing else.
    - Do not greet, sign off, or restate the question.

    ## Honesty

    - If you do not know, say so plainly. Do not invent commands, file paths,
      URLs, or API details.
    - If a request needs access you do not have, say what is missing rather
      than guessing at an answer.
    - You run unattended, so nobody is watching to catch a confident mistake.
  # opencode skills: instructions the agent loads on demand when a request
  # matches a skill's description, rather than carrying them in every prompt.
  # Each key is a skill name (lowercase, digits, hyphens) and becomes
  # /etc/mushroom/skills/custom/<name>/ in the pod. The value is either the
  # SKILL.md text, or a map of relative path to content when the skill needs
  # supporting files. Mounted files are read-only and not executable, so have
  # SKILL.md run scripts as `sh scripts/x.sh` rather than `./scripts/x.sh`.
  #
  # Skills baked into the image (images/agent/skills/) load alongside these.
  # See docs/skills.md.
  #
  #   skills:
  #     release-notes: |
  #       ---
  #       name: release-notes
  #       description: Draft release notes from merged PRs. Use when asked what shipped.
  #       ---
  #       List merged PRs since the last tag, group them by area, ...
  #     incident-triage:
  #       SKILL.md: |
  #         ---
  #         description: Triage a production alert. Use when someone pastes an alert.
  #         ---
  #         Run `sh scripts/recent-deploys.sh` first, then ...
  #       scripts/recent-deploys.sh: |
  #         #!/bin/sh
  #         ...
  skills: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  # Scratch space for opencode; also its HOME, so it is required.
  workspace:
    sizeLimit: 2Gi
  autoscaling:
    # CPU is a poor signal for queue consumers — scale on queue depth with
    # KEDA instead. See keda below.
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: {}

# Scale workers on pgmq depth. Requires KEDA in the cluster.
keda:
  enabled: false
  minReplicaCount: 0
  maxReplicaCount: 20
  pollingInterval: 15
  cooldownPeriod: 300
  # Target visible messages per worker.
  queueDepthTarget: "5"

# ---------------------------------------------------------------------------
# Traefik — the load balancer in front of the gateway
# ---------------------------------------------------------------------------
traefik:
  # IngressRoute is Traefik's own CRD. Set `ingress.enabled` instead to use a
  # plain Ingress object with any controller.
  ingressRoute:
    enabled: true
    entryPoints:
      - websecure
    # Slack posts to this host; it must be publicly resolvable and TLS-served.
    host: mushroom.example.com
    # Only the Slack endpoint is exposed. Metrics, stats and the event list
    # stay cluster-internal.
    path: /slack/events
    tls:
      enabled: true
      # Omit to use Traefik's default certificate resolver.
      secretName: ""
      certResolver: ""
    middlewares:
      # Slack bursts during an incident; the limit protects Postgres while
      # staying far above normal event volume.
      rateLimit:
        enabled: true
        average: 100
        burst: 200
      # Slack requires HTTPS for its request URL.
      redirectHttps:
        enabled: true

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: mushroom.example.com
  path: /slack/events
  pathType: Prefix
  tls: []

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
postgresql:
  # Bundled Postgres, deployed by this chart's own templates. Adequate for a
  # home or evaluation cluster. For anything you care about, set this to false
  # and point externalDatabase at a managed or operator-run instance with
  # backups.
  enabled: true
  image:
    # pgmq's official image: Postgres with pgmq as a compiled extension, so no
    # init script has to fetch anything at container start. Pinned, because
    # pgmq's own README quickstart still references an older version.
    repository: ghcr.io/pgmq/pg17-pgmq
    tag: v1.13.1
    pullPolicy: IfNotPresent
  auth:
    username: mushroom
    password: mushroom
    database: mushroom
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi
  persistence:
    enabled: true
    size: 20Gi
    # Empty uses the cluster's default StorageClass.
    storageClass: ""
  # RuntimeClass for the database pod. Empty uses the cluster default.
  #
  # Set this to a non-VM runtime (usually "runc") if your cluster defaults to
  # a microVM runtime such as Kata with Firecracker. Firecracker cannot share
  # a host directory with the guest, so the volume is copied into VM RAM and
  # every write is lost when the pod stops — with no error anywhere to say so.
  #
  # Symptom: the data directory shows as `tmpfs` inside the pod while the
  # PVC's host directory stays empty. Check with:
  #   kubectl -n <ns> exec <pg-pod> -- grep postgresql /proc/mounts
  runtimeClassName: ""
  # Pod securityContext for Postgres. Empty by default so the official
  # entrypoint can start as root, chown its data directory and then drop to
  # the postgres user itself — which is what works on storage that ignores
  # fsGroup, such as local-path-provisioner.
  #
  # On storage that honours fsGroup, prefer pinning the uid:
  #   podSecurityContext:
  #     runAsUser: 999
  #     runAsGroup: 999
  #     runAsNonRoot: true
  #     fsGroup: 999
  podSecurityContext: {}

externalDatabase:
  # Used when postgresql.enabled is false. Prefer supplying the whole DSN
  # through Vault rather than setting it here.
  host: ""
  port: 5432
  database: mushroom
  user: mushroom
  # Leave empty and let the secret provide DATABASE_URL.
  existingSecret: ""
  existingSecretKey: "database-url"

# ---------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------
secrets:
  # `plain`          — a Secret rendered from the values below (evaluation only).
  # `externalSecrets`— synced from Vault by External Secrets Operator.
  # `existing`       — a Secret you manage yourself.
  provider: plain

  # Keys expected in the resulting Secret, whichever provider creates it.
  keys:
    slackSigningSecret: slack-signing-secret
    slackBotToken: slack-bot-token
    modelApiKey: model-api-key
    databaseUrl: database-url

  existing:
    name: ""

  plain:
    # NEVER commit real values. Pass with --set or a values file kept out of
    # version control, and prefer the externalSecrets provider.
    slackSigningSecret: ""
    slackBotToken: ""
    modelApiKey: ""

  externalSecrets:
    # apiVersion external-secrets.io/v1 — v1beta1 stopped being served in
    # ESO v0.17.0, so a v1beta1 manifest will not apply on a current install.
    refreshInterval: 1h
    secretStore:
      # Reference an existing store, or let the chart create one below.
      name: vault-backend
      kind: ClusterSecretStore
      create: true
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      # KV v2 mount and the path holding the app's secrets.
      mountPath: secret
      version: v2
      path: mushroom
      auth:
        # Kubernetes auth: the pod's ServiceAccount token is exchanged for a
        # Vault token, so no static credential is stored in the cluster.
        kubernetes:
          mountPath: kubernetes
          role: mushroom
          # Vault 2.x requires an audience on the Kubernetes role.
          audience: vault
    # Map Vault keys to Secret keys. Vault key names on the right.
    remoteKeys:
      slackSigningSecret: slack_signing_secret
      slackBotToken: slack_bot_token
      modelApiKey: model_api_key
      databaseUrl: database_url

# ---------------------------------------------------------------------------
# Migrations
# ---------------------------------------------------------------------------
migrations:
  # Runs as a Helm pre-install/pre-upgrade hook, so schema changes land before
  # new code starts.
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600
  # How long the runner waits for Postgres to accept connections before giving
  # up. On a first install the database is still running initdb when this hook
  # fires, so this must cover a cold start.
  databaseWaitSeconds: 300
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
observability:
  logLevel: INFO
  logFormat: json
  metricsPort: 9090
  serviceMonitor:
    # Requires the Prometheus Operator CRDs.
    enabled: false
    interval: 30s
    labels: {}

# ---------------------------------------------------------------------------
# Security defaults applied to every pod
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  # Default-deny with explicit allows. Off by default since it requires a CNI
  # that enforces NetworkPolicy.
  enabled: false

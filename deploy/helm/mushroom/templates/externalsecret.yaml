{{- if eq .Values.secrets.provider "externalSecrets" }}
{{- $es := .Values.secrets.externalSecrets }}
{{- if $es.secretStore.create }}
{{/*
A ClusterSecretStore pointing at Vault, authenticating with the Kubernetes
auth method: ESO exchanges this chart's ServiceAccount token for a Vault
token, so no long-lived credential is ever stored in the cluster.

apiVersion is external-secrets.io/v1. v1beta1 stopped being served in ESO
v0.17.0, so older examples will not apply on a current installation.
*/}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $es.secretStore.name }}
  labels:
    {{- include "mushroom.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ $es.vault.server | quote }}
      path: {{ $es.vault.mountPath | quote }}
      version: {{ $es.vault.version | quote }}
      auth:
        kubernetes:
          mountPath: {{ $es.vault.auth.kubernetes.mountPath | quote }}
          role: {{ $es.vault.auth.kubernetes.role | quote }}
          {{- with $es.vault.auth.kubernetes.audience }}
          {{/* Vault 2.x requires an audience on the Kubernetes role. */}}
          audiences:
            - {{ . | quote }}
          {{- end }}
          serviceAccountRef:
            name: {{ include "mushroom.serviceAccountName" . }}
            namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "mushroom.fullname" . }}
  labels:
    {{- include "mushroom.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStore.name }}
    kind: {{ $es.secretStore.kind }}
  target:
    # ESO creates and owns this Secret; the pods consume it by name and never
    # talk to Vault themselves.
    name: {{ include "mushroom.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secrets.keys.slackSigningSecret }}
      remoteRef:
        key: {{ $es.vault.path }}
        property: {{ $es.remoteKeys.slackSigningSecret }}
    - secretKey: {{ .Values.secrets.keys.slackBotToken }}
      remoteRef:
        key: {{ $es.vault.path }}
        property: {{ $es.remoteKeys.slackBotToken }}
    - secretKey: {{ .Values.secrets.keys.modelApiKey }}
      remoteRef:
        key: {{ $es.vault.path }}
        property: {{ $es.remoteKeys.modelApiKey }}
    {{- if not .Values.postgresql.enabled }}
    - secretKey: {{ .Values.secrets.keys.databaseUrl }}
      remoteRef:
        key: {{ $es.vault.path }}
        property: {{ $es.remoteKeys.databaseUrl }}
    {{- end }}
  {{- if .Values.postgresql.enabled }}
  # The bundled Postgres owns its own credentials, so the DSN is templated
  # rather than fetched. Vault supplies it when using an external database.
  dataFrom: []
  {{- end }}
{{- end }}

{{- if .Values.networkPolicy.enabled }}
{{/*
Default-deny with explicit allows. The gateway accepts ingress only from
Traefik; both components egress to Postgres and DNS, and the workers
additionally need outbound HTTPS to reach Slack and the model provider.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mushroom.fullname" . }}-gateway
  labels:
    {{- include "mushroom.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mushroom.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.service.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # DNS.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Outbound HTTPS, for posting to the Slack API.
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mushroom.fullname" . }}-agent
  labels:
    {{- include "mushroom.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mushroom.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  policyTypes: [Ingress, Egress]
  ingress:
    # Metrics scraping only.
    - ports:
        - protocol: TCP
          port: {{ .Values.observability.metricsPort }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Slack API and the model provider.
    - ports:
        - protocol: TCP
          port: 443
{{- end }}

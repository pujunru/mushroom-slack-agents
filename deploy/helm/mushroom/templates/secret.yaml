{{- if eq .Values.secrets.provider "plain" }}
{{/*
Evaluation-only secret. Values come from --set or an untracked values file;
for anything real use secrets.provider=externalSecrets so Vault stays the
source of truth and no credential is templated into a manifest.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mushroom.secretName" . }}
  labels:
    {{- include "mushroom.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.slackSigningSecret }}: {{ required "secrets.plain.slackSigningSecret is required with the plain provider" .Values.secrets.plain.slackSigningSecret | quote }}
  {{ .Values.secrets.keys.slackBotToken }}: {{ required "secrets.plain.slackBotToken is required with the plain provider" .Values.secrets.plain.slackBotToken | quote }}
  {{ .Values.secrets.keys.anthropicApiKey }}: {{ .Values.secrets.plain.anthropicApiKey | quote }}
  {{ .Values.secrets.keys.databaseUrl }}: {{ include "mushroom.databaseUrlFromValues" . | quote }}
{{- end }}

{{- if .Values.postgresql.enabled }}
{{/*
Postgres, deployed directly rather than via a dependency chart.

The image is pgmq's official build, which ships pgmq as a compiled extension.
That removes the one genuinely fragile piece of the earlier setup: a Bitnami
image with no pgmq, loaded at first boot by an initdb script that curled
pgmq's SQL from GitHub — so a cold start needed working egress to raw
.githubusercontent.com, and the load ran only on a fresh volume.

This is a single-replica StatefulSet with a PVC. Appropriate for a home or
evaluation cluster; for anything you care about, set postgresql.enabled=false
and point externalDatabase at a managed or operator-run instance.

All three resources are installed as pre-install/pre-upgrade hooks at weight
-8, below the migration Job's -5. That is not decoration: Helm creates no
ordinary resources until every hook has completed, so a migration Job that
waits for Postgres would wait for a Service that Helm will not create until
the Job exits. The symptom is the Job logging "Name or service not known"
until it times out.

resource-policy keep means `helm uninstall` leaves the data behind. Delete the
PVC explicitly to destroy the database.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mushroom.fullname" . }}-postgresql
  labels:
    {{- include "mushroom.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    {{- include "mushroom.postgresHookAnnotations" . | nindent 4 }}
type: Opaque
stringData:
  # A generated password would rotate on every upgrade and break the existing
  # volume's authentication, so this is taken from values with a default.
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mushroom.fullname" . }}-postgresql
  labels:
    {{- include "mushroom.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    {{- include "mushroom.postgresHookAnnotations" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "mushroom.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mushroom.fullname" . }}-postgresql
  labels:
    {{- include "mushroom.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    {{- include "mushroom.postgresHookAnnotations" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "mushroom.fullname" . }}-postgresql
  selector:
    matchLabels:
      {{- include "mushroom.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "mushroom.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      securityContext:
        # Deliberately no runAsUser/runAsNonRoot/fsGroup here.
        #
        # The official Postgres entrypoint starts as root, chowns PGDATA to the
        # postgres user, and then re-executes itself as that user via gosu — so
        # the server process never runs as root. Letting it do that is the only
        # thing that works on this cluster's storage.
        #
        # Everything else was tried and provably fails here: fsGroup is ignored
        # (a volume mounted with fsGroup: 999 still presents as root:root 0755,
        # and the container can neither chmod nor write it), and an init
        # container's chown is discarded — it reports 999:999 700 on exit while
        # the main container then sees 0:0 755. Both verified with minimal
        # probe pods on this node, not inferred.
        #
        # The image sets USER postgres, so runAsUser: 0 is required to let the
        # entrypoint chown at all. It drops to the postgres user via gosu
        # immediately afterwards, so the server process is unprivileged.
        #
        # On storage that honours fsGroup, prefer runAsUser: 999 with
        # fsGroup: 999 via postgresql.podSecurityContext.
        {{- if .Values.postgresql.podSecurityContext }}
        {{- toYaml .Values.postgresql.podSecurityContext | nindent 8 }}
        {{- else }}
        runAsUser: 0
        {{- end }}
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              # CHOWN/FOWNER/DAC_OVERRIDE let the entrypoint take ownership of
              # the data directory; SETUID/SETGID let it drop to the postgres
              # user afterwards. Everything else is dropped.
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mushroom.fullname" . }}-postgresql
                  key: postgres-password
            # Left at the image default (the mount point). The entrypoint runs
            # as root and chowns this directory before dropping to the postgres
            # user, so it needs no help from the volume's initial ownership.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}, "-d", {{ .Values.postgresql.auth.database | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}, "-d", {{ .Values.postgresql.auth.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        {{- if not .Values.postgresql.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
  {{- end }}
{{- end }}

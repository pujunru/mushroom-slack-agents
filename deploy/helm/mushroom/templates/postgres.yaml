{{- if .Values.postgresql.enabled }}
{{/*
Postgres, deployed directly rather than via a dependency chart.

The image is pgmq's official build, which ships pgmq as a compiled extension.
That removes the one genuinely fragile piece of the earlier setup: a Bitnami
image with no pgmq, loaded at first boot by an initdb script that curled
pgmq's SQL from GitHub — so a cold start needed working egress to raw
.githubusercontent.com, and the load ran only on a fresh volume.

This is a single-replica StatefulSet with a PVC. Appropriate for a home or
evaluation cluster; for anything you care about, set postgresql.enabled=false
and point externalDatabase at a managed or operator-run instance.

All three resources are installed as pre-install/pre-upgrade hooks at weight
-8, below the migration Job's -5. That is not decoration: Helm creates no
ordinary resources until every hook has completed, so a migration Job that
waits for Postgres would wait for a Service that Helm will not create until
the Job exits. The symptom is the Job logging "Name or service not known"
until it times out.

resource-policy keep means `helm uninstall` leaves the data behind. Delete the
PVC explicitly to destroy the database.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mushroom.fullname" . }}-postgresql
  labels:
    {{- include "mushroom.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    {{- include "mushroom.postgresHookAnnotations" . | nindent 4 }}
type: Opaque
stringData:
  # A generated password would rotate on every upgrade and break the existing
  # volume's authentication, so this is taken from values with a default.
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mushroom.fullname" . }}-postgresql
  labels:
    {{- include "mushroom.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    {{- include "mushroom.postgresHookAnnotations" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "mushroom.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mushroom.fullname" . }}-postgresql
  labels:
    {{- include "mushroom.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    {{- include "mushroom.postgresHookAnnotations" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "mushroom.fullname" . }}-postgresql
  selector:
    matchLabels:
      {{- include "mushroom.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "mushroom.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      securityContext:
        # The official image runs as uid 999 and needs to own its data dir.
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
      {{- if .Values.postgresql.persistence.enabled }}
      initContainers:
        # local-path-provisioner creates the host directory as root:root 0755,
        # despite its own setup script saying `mkdir -m 0777` — umask wins.
        # fsGroup cannot rescue that: initdb chmods its data directory, and
        # chmod requires *ownership*, not group membership. So Postgres dies
        # with "could not change permissions of directory ... Operation not
        # permitted" on every start.
        #
        # This runs once as root to hand the directory to uid 999, which is
        # what the postgres user needs before initdb will proceed. It is a
        # no-op on storage whose provisioner already honours fsGroup.
        - name: init-permissions
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              echo "before: $(stat -c '%u:%g %a' /var/lib/postgresql/data)"
              chown 999:999 /var/lib/postgresql/data
              chmod 0700 /var/lib/postgresql/data
              echo "after:  $(stat -c '%u:%g %a' /var/lib/postgresql/data)"
          securityContext:
            # Explicitly root, overriding the pod's runAsUser/runAsNonRoot:
            # chowning a root-owned directory is the entire purpose here.
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- end }}
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mushroom.fullname" . }}-postgresql
                  key: postgres-password
            # PGDATA is deliberately left at the image's default, which is the
            # mount point itself. The official entrypoint chowns and
            # permissions that directory during initdb, so no init container
            # is needed to fix up a root-owned hostPath volume.
            #
            # Pointing PGDATA at a *subdirectory* instead looks tidier but
            # breaks on hostPath storage: the subdirectory has to be created by
            # the postgres user inside a root-owned parent, which fails with
            # "mkdir: Permission denied" and crashloops the pod.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}, "-d", {{ .Values.postgresql.auth.database | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}, "-d", {{ .Values.postgresql.auth.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        {{- if not .Values.postgresql.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
  {{- end }}
{{- end }}

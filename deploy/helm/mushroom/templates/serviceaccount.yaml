{{- if .Values.serviceAccount.create }}
{{/*
Also installed as a pre-install/pre-upgrade hook, at a weight below the
migration Job's.

The migration Job runs as a hook, and Helm creates hook resources before
ordinary ones — so without this the Job is created while its ServiceAccount
does not yet exist, and the Job fails with "serviceaccount not found" until it
exhausts its backoff limit.

`before-hook-creation` is deliberately absent from the delete policy: deleting
and recreating the ServiceAccount on every upgrade would invalidate the tokens
the running pods are using.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mushroom.serviceAccountName" . }}
  labels:
    {{- include "mushroom.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/resource-policy": keep
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

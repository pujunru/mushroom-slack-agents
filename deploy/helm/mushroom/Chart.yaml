apiVersion: v2
name: mushroom
description: Slack event pipeline — stateless Bolt gateway, Postgres KV + pgmq queue, and opencode agent workers.
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/your-org/mushroom
sources:
  - https://github.com/your-org/mushroom
keywords:
  - slack
  - agents
  - pgmq
  - opencode
maintainers:
  - name: Mushroom contributors

# No chart dependencies. Postgres is deployed by this chart's own templates
# using the official pgmq image, which ships pgmq as a real extension.
#
# An earlier version depended on the Bitnami postgresql chart. That was dropped
# because Bitnami retired their free Docker Hub catalog, so the pinned image
# stopped resolving entirely — and because the Bitnami image has no pgmq, which
# forced a fragile initdb script that curled pgmq's SQL at container start.

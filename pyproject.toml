# Workspace-level tooling config. Each service has its own pyproject for
# packaging; this file configures lint and test for the whole repo.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [
    "packages/mushroom-core",
    "services/gateway",
    "services/agent",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle / pyflakes
    "I",               # import sorting
    "UP",              # pyupgrade
    "B",               # bugbear
    "ASYNC",           # async pitfalls
    "S",               # bandit security checks
    "C4", "SIM", "RET", "PTH", "RUF",
]
ignore = [
    "S101",    # assert is fine in tests
    "RET504",  # named return values aid readability
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "SLF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

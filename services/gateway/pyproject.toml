[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mushroom-gateway"
version = "0.1.0"
description = "Stateless Slack ingest: verifies, stores and enqueues Slack events."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mushroom-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "slack-bolt>=1.21",
    "slack-sdk>=3.33",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["mushroom_gateway"]

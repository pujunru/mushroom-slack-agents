[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mushroom-agent"
version = "0.1.0"
description = "Queue-consuming agent worker that runs opencode and replies to Slack."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mushroom-core",
    # The async web client needs aiohttp, which slack-sdk treats as an
    # optional extra. Without it `from slack_sdk.web.async_client import
    # AsyncWebClient` raises ModuleNotFoundError at runtime — long after the
    # image builds cleanly.
    "slack-sdk[optional]>=3.33",
    "aiohttp>=3.10",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["mushroom_agent"]
